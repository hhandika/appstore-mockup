[project]
name = "appstore-mockup"
version = "0.1.0"
description = "Mockup generator CLI tool for app store listings."
readme = "README.md"
authors = [
    { name = "Heru Handika" }
]
license = { text = "MIT License" }
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "pydantic>=2.0.0",
    "tqdm>=4.68.2",
]

[project.scripts]
appstore-mockup = "appstore_mockup.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["appstore_mockup*"]

